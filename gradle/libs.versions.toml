[versions]
appcompat = "1.8.0"
blocks = "12.0.0"
agp = "9.4.1"
pedro = "1.1.1"
revhub = "3.0.1"
robot = "0.2.1"
tuning = "1.0.2"
kotlin = "2.4.10"
coreKtx = "1.19.1"

[libraries]
appcompat = { module = "androidx.appcompat:appcompat", version.ref = "appcompat" }
blocks = { module = "org.firstinspires.ftc:Blocks", version.ref = "blocks" }
ftccommon = { module = "org.firstinspires.ftc:FtcCommon", version.ref = "blocks" }
hardware = { module = "org.firstinspires.ftc:Hardware", version.ref = "blocks" }
inspection = { module = "org.firstinspires.ftc:Inspection", version.ref = "blocks" }
onbotjava = { module = "org.firstinspires.ftc:OnBotJava", version.ref = "blocks" }
pedro = { module = "com.pedropathing.ivy:pedro", version.ref = "pedro" }
revhub = { module = "com.pedropathing:revhub", version.ref = "revhub" }
#noinspection Aligned16KB
robotcore = { module = "org.firstinspires.ftc:RobotCore", version.ref = "blocks" }
robotserver = { module = "org.firstinspires.ftc:RobotServer", version.ref = "blocks" }
tuning = { module = "com.pedropathing:tuning", version.ref = "tuning" }
vision = { module = "org.firstinspires.ftc:Vision", version.ref = "blocks" }
core-ktx = { group = "androidx.core", name = "core-ktx", version.ref = "coreKtx" }

nextftc-control = { module = "dev.nextftc.v2:control", version.ref = "robot" }
nextftc-hardware = { module = "dev.nextftc.v2:hardware", version.ref = "robot" }
nextftc-robot = { module = "dev.nextftc.v2:robot", version.ref = "robot" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
android-library = { id = "com.android.library", version.ref = "agp" }
kotlin-android = { id = "org.jetbrains.kotlin.android", version = "2.4.21" }
